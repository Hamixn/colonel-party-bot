name: Colonel Party Bot 24/7 Runner

on:
  workflow_dispatch:
  schedule:
    # Automatically triggers every 5 hours to keep the bot alive indefinitely
    - cron: '0 */5 * * *'
  push:
    branches: [master]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID || '102725917' }}
          PLAYER_CAP: '20'
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::BOT_TOKEN secret is not set! Please add BOT_TOKEN in Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          python bot.py
