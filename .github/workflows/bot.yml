name: Colonel Party Bot 24/7 Runner

on:
  workflow_dispatch:
  schedule:
    # Automatically triggers every 5 hours to keep the bot alive indefinitely
    - cron: '0 */5 * * *'
  push:
    branches: [master]

concurrency:
  group: bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot
        run: |
          TOKEN="${{ secrets.BOT_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="8732768966:AAGThitIZG2IddxiyokS0PGCn_m_fHr-gRo"
          fi
          export BOT_TOKEN="$TOKEN"
          export ADMIN_USER_ID="${{ secrets.ADMIN_USER_ID || '102725917' }}"
          export PLAYER_CAP="20"
          echo "🚀 Launching Colonel Party Bot on GitHub Actions Cloud..."
          python bot.py
